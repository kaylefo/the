<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NO ALIBI</title>
<style>
html,body{margin:0;min-height:100%;background:#09090b;color:#f5f2e9;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center;overflow:hidden}.boot{text-align:center;padding:32px}.boot strong{display:block;font-size:clamp(36px,13vw,76px);letter-spacing:-.075em}.boot span{display:block;margin-top:12px;color:#9999a3;font-size:12px;letter-spacing:.18em;text-transform:uppercase;line-height:1.55}.bar{width:min(260px,70vw);height:3px;background:#27272d;margin:24px auto 0;overflow:hidden;border-radius:99px}.bar:after{content:"";display:block;width:45%;height:100%;background:#ff4a35;animation:load .75s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(125%)}}.error span{color:#ffbd2e;max-width:560px;margin-left:auto;margin-right:auto}.retry{margin-top:22px;border:1px solid #55545c;background:#f5f2e9;color:#111114;border-radius:999px;padding:13px 22px;font:800 12px/1 system-ui;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<div class="boot" id="boot"><strong>NO ALIBI</strong><span id="status">Loading 2,000 offline cards</span><div class="bar"></div></div>
<script>
(async()=>{
  const boot=document.getElementById("boot");
  const status=document.getElementById("status");
  const ROOT="/the/no-alibi/";
  const LOCAL_BASE=location.origin+ROOT+"data/";
  const RAW_BASE="https://raw.githubusercontent.com/kaylefo/the/main/no-alibi/data/";
  const failures=[];

  function validChunk(text){
    const compact=String(text||"").replace(/\s+/g,"");
    return compact.length>1000 && /^[A-Za-z0-9+/=]+$/.test(compact);
  }

  async function rememberLocal(index,text){
    if(!("caches" in window))return;
    try{
      const cache=await caches.open("no-alibi-v5");
      await cache.put(LOCAL_BASE+`part-${index}.txt`,new Response(text,{headers:{"Content-Type":"text/plain; charset=utf-8"}}));
    }catch(_){ }
  }

  async function loadPart(index){
    const file=`part-${index}.txt`;
    const candidates=[
      new URL(`data/${file}`,location.href).href,
      LOCAL_BASE+file,
      RAW_BASE+file
    ].filter((value,pos,list)=>list.indexOf(value)===pos);

    for(const url of candidates){
      try{
        const response=await fetch(url,{cache:"reload"});
        if(!response.ok){failures.push(`${file}: ${response.status} at ${url}`);continue;}
        const text=await response.text();
        if(!validChunk(text)){failures.push(`${file}: invalid response at ${url}`);continue;}
        await rememberLocal(index,text);
        return text;
      }catch(error){
        failures.push(`${file}: ${String(error&&error.message||error)} at ${url}`);
      }
    }
    throw new Error(`Could not retrieve ${file}.`);
  }

  try{
    if(typeof DecompressionStream!=="function")throw new Error("Open this link in the current version of Safari or Chrome.");

    const parts=[];
    for(let i=0;i<8;i++){
      status.textContent=`Loading offline deck · ${i+1}/8`;
      parts.push(await loadPart(i));
    }

    status.textContent="Opening game";
    const b64=parts.join("").replace(/\s+/g,"");
    const binary=atob(b64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const app=await new Response(stream).text();
    if(!app.includes("NO_ALIBI_CORE_DECK")||!app.includes("core-dare-5-200"))throw new Error("The downloaded deck is incomplete.");

    if("serviceWorker" in navigator){
      navigator.serviceWorker.register(ROOT+"sw.js?v=5",{scope:ROOT,updateViaCache:"none"}).catch(()=>{});
    }

    document.open();
    document.write(app);
    document.close();
  }catch(error){
    console.error("NO ALIBI loader failure",error,failures);
    boot.classList.add("error");
    boot.innerHTML=`<strong>NO ALIBI</strong><span>${String(error&&error.message||error)}<br><br>Tap retry. If it repeats, open this page directly in Safari.</span><button class="retry" type="button" onclick="location.reload()">RETRY</button>`;
  }
})();
</script>
</body>
</html>
