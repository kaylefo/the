eight:900;letter-spacing:.12em}.field select,.field input{width:100%;height:46px;border:1px solid #414048;border-radius:13px;background:#202025;color:var(--text);padding:0 12px;font-weight:800}.sheet button,.filelabel{display:block;width:100%;min-height:47px;margin-top:9px;border:1px solid #45434b;border-radius:13px;background:#202025;color:var(--text);padding:13px;text-align:center;font-size:11px;font-weight:950;letter-spacing:.08em}.sheet .close{background:var(--cream);color:#111;border:0}.danger{color:#ff7562!important}input[type=file]{display:none}.toast{position:fixed;left:50%;bottom:25px;z-index:20;transform:translate(-50%,16px);opacity:0;border-radius:99px;background:var(--cream);color:#111;padding:11px 15px;font-size:11px;font-weight:950;transition:.18s;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}button:active{transform:scale(.97)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--truth);outline-offset:2px}@media(max-height:720px){.card{min-height:345px}.prompt{font-size:26px}.actions button{min-height:58px}}@media(max-width:370px){.grid{grid-template-columns:1fr}.prompt{font-size:25px}.stats{gap:14px}}

<body>
<main class="app">
<header class="top"><div><div class="brand">NO ALIBI</div><small class="sub">2,000 CARDS · ONE OFFLINE PAGE</small></div><button class="icon" id="settings" type="button" aria-label="Open settings">⚙</button></header>

</main>
<div class="overlay" id="overlay"><section class="sheet"><h2>GAME SETTINGS</h2><p>The 2,000-card deck is generated entirely inside this page. There are no APIs, decoders, remote assets, or external scripts.</p><div class="grid"><div class="field"><label for="mix">INTENSITY MIX</label><select id="mix"><option value="full">FULL SPECTRUM</option><option value="light">MOSTLY LIGHT</option><option value="savage">MOSTLY SAVAGE</option></select></div><div class="field"><label for="maxPenalty">MAX PENALTY</label><select id="maxPenalty"><option>3</option><option>4</option><option selected>5</option></select></div><div class="field"><label for="unit">PENALTY WORD</label><input id="unit" maxlength="12" value="SIP"></div><div class="field"><label for="vibrate">HAPTICS</label><select id="vibrate"><option value="yes">ON</option><option value="no">OFF</option></select></div></div><label class="filelabel" for="file">IMPORT JSON CARD PACK</label><input id="file" type="file" accept="application/json,.json"><button id="reshuffle" type="button">RESHUFFLE ALL POOLS</button><button id="clearImported" type="button" class="danger">REMOVE IMPORTED CARDS</button><button id="save" type="button" class="close">SAVE + RETURN</button></section></div>

<script>

[5,"NO ALIBI","Choose {a} and {b}.",["the person you have unresolved tension with","the person you judge hardest","the person you would choose for one consequence-free night","the person you trust least","the person you envy most","the person you think is fake","the person you would cut off first","the person you are most curious about","the person you owe the ugliest truth","a consenting adult player"],["tell them the full truth for one minute","say what you have been avoiding","name the exact moment it started","admit what you wanted from them","answer their one follow-up","say the harshest honest thing","confess the attraction or lack of it","explain the betrayal","say what could never work","give the room the uncensored version"]],
[5,"EVIDENCE","Find your {a} and {b}.",["riskiest outgoing DM","own sent sext line","most incriminating search","deleted-message screenshot","hidden album title","most embarrassing thirst trap","worst dating-app opener","last profile you stalked","most revealing draft","message you regret most"],["show it with identities hidden","read only your own words","explain the uncensored context","let the room ask three questions","say why it still exists","admit what you hoped would happen","rank how damaging it is","say whether you would send it again","name the lie attached to it","tell the part you usually omit"]]
];
var PEN={1:[1,1,1,1,2],2:[1,2,2,2,3],3:[2,3,3,3,4],4:[3,4,4,4,5],5:[4,5,5,5,5]};
var LEVEL=["","WARM-UP","NOSY","MESSY","BRUTAL","NUCLEAR"];
var WEIGHTS={full:[20,25,25,20,10],light:[40,30,18,9,3],savage:[5,10,20,30,35]};
var deck=[],custom=[],pools={},mode="mixed",round=0,played=0,done=0,passed=0,current=null,settingsData={mix:"full",max:5,unit:"SIP",vibrate:true};
function byId(id){return document.getElementById(id)}
function clean(s){s=String(s).replace(/\s+/g," ").trim().replace(" ?","?").replace(" .",".");return /[.?!]$/.test(s)?s:s+"."}
function makeCards(families,type){for(var f=0;f<families.length;f++){var x=families[f],level=x[0],tag=x[1],template=x[2],A=x[3],B=x[4];for(var i=0;i<A.length;i++){for(var j=0;j<B.length;j++){deck.push({id:type+"-"+f+"-"+i+"-"+j,type:type,intensity:level,penalty:PEN[level][(i+j+f)%5],tag:tag,text:clean(template.replace("{a}",A[i]).replace("{b}",B[j]))})}}}}
function randomInt(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=randomInt(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function rebuild(){var all=deck.concat(custom);pools={};for(var i=0;i<all.length;i++){var c=all[i],key=c.type+"-"+c.intensity;if(!pools[key])pools[key]=[];pools[key].push(c)}for(var k in pools){if(Object.prototype.hasOwnProperty.call(pools,k))shuffle(pools[k])}byId("status").textContent="READY · "+all.length.toLocaleString()+" CARDS · NO NETWORK";byId("status").className="status ok"}
function rollLevel(){var w=WEIGHTS[settingsData.mix]||WEIGHTS.full,total=0,i;for(i=0;i<w.length;i++)total+=w[i];var r=Math.random()*total;for(i=0;i<w.length;i++){r-=w[i];if(r<0)return i+1}return 3}
function pull(type,level){var key=type+"-"+level;if(!pools[key]||!pools[key].length){var all=deck.concat(custom),fresh=[];for(var i=0;i<all.length;i++)if(all[i].type===type&&all[i].intensity===level)fresh.push(all[i]);pools[key]=shuffle(fresh)}return pools[key].pop()}

function render(c){current=c;round++;var card=byId("card");card.className="card "+c.type;byId("kind").textContent=c.type.toUpperCase();byId("tag").textContent=c.tag;byId("round").textContent="ROUND "+String(round).padStart(2,"0");var prompt=byId("prompt");prompt.textContent=c.text;prompt.className="prompt"+(c.text.length>105?" small":"");byId("levelName").textContent=LEVEL[c.intensity];var p=Math.max(1,Math.min(settingsData.max,c.penalty));byId("penalty").textContent=unitText(p);byId("pass").textContent="PASS · "+unitText(p);var bars="";for(var i=1;i<=5;i++)bars+="<i class='"+(i<=c.intensity?"on":"")+"'></i>";byId("dots").innerHTML=bars;if(settingsData.vibrate&&navigator.vibrate)navigator.vibrate(8+c.intensity*3)}

try{makeCards(TF,"truth");makeCards(DF,"dare");if(deck.length!==2000)throw new Error("Deck count is "+deck.length+", expected 2000");loadCustom();loadSettings();bind();rebuild();draw()}catch(e){showError(e.message||String(e))}
